# Every value can be overridden by the environment variable next to it, or the whole file with -Dconfig.file=...
app {
  http {
    host = "0.0.0.0"
    host = ${?HTTP_HOST}
    port = 8080
    port = ${?HTTP_PORT}
    # The built client: dist (sbt client/webDist) or debugDist (sbt client/webDebugDist), relative to the working
    # directory.
    staticContentDir = "dist"
    staticContentDir = ${?STATIC_CONTENT_DIR}
  }

  telemetry {
    serviceName = "full-zio-stack"
    # OTLP/HTTP endpoint of a collector, e.g. http://localhost:4318. Empty: spans are recorded by a no-op tracer and
    # nothing is exported.
    endpoint = ""
    endpoint = ${?OTEL_EXPORTER_OTLP_ENDPOINT}
  }

  # Only used by projects generated with authentication.
  auth {
    # Signs session tokens. Empty means "generate one at startup", which is fine for development but logs everyone
    # out on every restart, so set it in production.
    secret = ""
    secret = ${?AUTH_SECRET}
    # Where the client is reachable; the links in registration and password-recovery emails point here.
    webHostUrl = "http://localhost:8080"
    webHostUrl = ${?WEB_HOST_URL}
    sessionMinutes = 60
    refreshMinutes = 1440
    # false so that logging in over plain http works in development. Set it in production, where the client is
    # served over https.
    secureCookie = false
  }

  db {
    # Matches docker-compose.yml.
    url = "jdbc:mariadb://localhost:13306/fullziostack"
    url = ${?DB_URL}
    user = "fullziostack"
    user = ${?DB_USER}
    password = "fullziostack"
    password = ${?DB_PASSWORD}
    migrationsLocation = "classpath:db/migration/mysql"
  }
}
